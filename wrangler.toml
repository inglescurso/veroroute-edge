name = "veroroute-edge"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

# keep_vars evita que deploys do GitHub removam variaveis e segredos
# configurados no Cloudflare Dashboard.
keep_vars = true

[ai]
binding = "AI"

[vars]
# AUTH_TOKEN define a senha de acesso ao painel e a Admin API.
# O valor "admin" entra em toda instalacao nova; o usuario troca em
# Settings -> Variables and Secrets quando quiser.
AUTH_TOKEN = "admin"
SEARXNG_URL = "opcional"
DEFAULT_ROUTING_STRATEGY = "priority"
DEFAULT_OUTPUT_STYLE = "none"
ENABLE_MODALITY_BRIDGE = "true"
ENABLE_CONTEXT_COMPRESSION = "true"
ENABLE_JINA_READER = "true"
ENABLE_MCP_SERVER = "false"
ENABLE_QUOTA_SHARING = "false"
MAX_RETRIES = "3"
RETRY_DELAY_MS = "1000"
CASCADE_TIMEOUT_MS = "45000"
CACHE_TTL_SECONDS = "3600"
QUOTA_MAX_REQUESTS = "1000"
QUOTA_WINDOW_SECONDS = "60"

[observability]
enabled = true

# Automatic KV provisioning during the first Cloudflare Git deploy.
[[kv_namespaces]]
binding = "OMNI_KEYS"

[[kv_namespaces]]
binding = "OMNI_CACHE"
