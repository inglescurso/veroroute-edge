name = "veroroute-edge"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

# AUTH_TOKEN is intentionally omitted so Sync fork builds preserve the Dashboard password.
# Fresh installs use the documented admin fallback until the user changes it.
keep_vars = true

[ai]
binding = "AI"

[vars]
SEARXNG_URL = "opcional"
DEFAULT_ROUTING_STRATEGY = "priority"
DEFAULT_OUTPUT_STYLE = "none"
ENABLE_MODALITY_BRIDGE = "true"
ENABLE_CONTEXT_COMPRESSION = "true"
ENABLE_JINA_READER = "true"
ENABLE_MCP_SERVER = "false"
ENABLE_QUOTA_SHARING = "false"
MAX_RETRIES = "3"
RETRY_DELAY_MS = "1000"
CASCADE_TIMEOUT_MS = "45000"
CACHE_TTL_SECONDS = "3600"
QUOTA_MAX_REQUESTS = "1000"
QUOTA_WINDOW_SECONDS = "60"

[observability]
enabled = true

# Automatic KV provisioning during the first Cloudflare Git deploy.
[[kv_namespaces]]
binding = "OMNI_KEYS"

[[kv_namespaces]]
binding = "OMNI_CACHE"
